name: latticemere-maint-bootstrap
run-name: latticemere-maint-bootstrap

on:
  push:
    branches:
      - main
    paths:
      - '.latticemere-maint/bootstrap-trigger.txt'

permissions:
  contents: write

jobs:
  bootstrap:
    environment: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Build node-encrypted mailbox bootstrap
        shell: bash
        env:
          MAILBOX_DEPLOY_KEY: ${{ secrets.MAILBOX_DEPLOY_KEY }}
          MAILBOX_SSH_URL: ${{ secrets.MAILBOX_SSH_URL }}
          NODE_CERT_B64: 
        run: |
          set +x
          set -euo pipefail
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$NODE_CERT_B64" | base64 -d > "$work/node.crt.pem"
          python -c 'import json,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"]).joinpath("latt_mailbox_bootstrap.json").write_text(json.dumps({"schema":"LATT_MAINT_MAILBOX_BOOTSTRAP/1","mailbox_ssh_url":os.environ["MAILBOX_SSH_URL"],"mailbox_deploy_key":os.environ["MAILBOX_DEPLOY_KEY"]},separators=(",",":")))'
          openssl cms -encrypt -binary -aes256 -in "$RUNNER_TEMP/latt_mailbox_bootstrap.json" -outform DER -out "$work/bootstrap.p7m" "$work/node.crt.pem"
          base64 -w 0 "$work/bootstrap.p7m" > "$work/bootstrap.p7m.b64"
          git fetch origin latticemere-maint-transport
          git worktree add "$work/transport" origin/latticemere-maint-transport
          mkdir -p "$work/transport/.latticemere-maint"
          cp "$work/bootstrap.p7m.b64" "$work/transport/.latticemere-maint/bootstrap.p7m.b64"
          cd "$work/transport"
          git config user.name "latticemere-maint-bootstrap"
          git config user.email "latticemere-maint-bootstrap@users.noreply.github.com"
          git add .latticemere-maint/bootstrap.p7m.b64
          git commit -m "Publish node-encrypted Latticemere mailbox bootstrap"
          git push origin HEAD:latticemere-maint-transport
