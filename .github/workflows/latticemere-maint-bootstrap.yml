name: latticemere-maint-bootstrap
run-name: latticemere-maint-bootstrap

on:
  push:
    branches:
      - main
    paths:
      - '.latticemere-maint/bootstrap-trigger.txt'

permissions:
  contents: write

jobs:
  bootstrap:
    environment: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Build node-encrypted mailbox bootstrap
        shell: bash
        env:
          MAILBOX_DEPLOY_KEY: ${{ secrets.MAILBOX_DEPLOY_KEY }}
          MAILBOX_SSH_URL: ${{ secrets.MAILBOX_SSH_URL }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cat > "$work/node.crt.pem" <<'CERT'
